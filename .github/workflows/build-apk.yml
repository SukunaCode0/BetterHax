name: Build ProtoHax APK (1.26.50)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Unpack patched ProtoHax library (1.26.50, in-repo)
        run: |
          rm -rf /tmp/protohax-lib
          unzip -q protohax-lib-1.26.50.zip -d /tmp/protohax-lib
          ls /tmp/protohax-lib

      - name: Publish library to mavenLocal
        run: |
          LIB=$(find /tmp/protohax-lib -maxdepth 2 -name "build.gradle" | head -n 1 | xargs dirname)
          echo "Library at $LIB"
          cd "$LIB"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Point app at 1.5.0
        run: sed -i "s/dev.sora.relay:ProtoHax:1.4.0/dev.sora.relay:ProtoHax:1.5.0/" app/build.gradle && grep -n "ProtoHax" app/build.gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-1.26.50-apk
          path: app/build/outputs/apk/debug/*.apk
